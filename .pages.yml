# Pages CMS configuration: the editing forms the client sees at app.pagescms.org.
# Content lives in src/content/<kind>/<id>.json (one file per product / brand).
# Fields marked "Layout (designer only)" are read-only for the client.
# The client's Media screen only shows public/assets/uploads, so the site's own
# images cannot be deleted from the CMS.

media:
  input: public/assets/uploads
  output: /assets/uploads
  rename: safe
  extensions: [jpg, jpeg, png, webp, avif, gif, pdf, mp4]

content:
  - name: products
    label: Products
    type: collection
    path: src/content/products
    format: json
    filename: "{id}.json"
    operations:
      rename: false
      delete: false
    view:
      primary: name
      fields: [name, brand, category, availability]
      sort: [order, name, brand, category]
      search: [name, brand, designer, category]
      default:
        sort: order
        order: asc
    fields:
      - name: id
        label: Product ID (unique, lowercase with dashes, e.g. thonet-s-33)
        type: string
        required: true
      - name: name
        label: Name
        type: string
        required: true
      - name: brand
        label: Brand
        type: select
        required: true
        options:
          values:
            - { name: indo, label: "Indonesian Stools" }
            - { name: gaga, label: "Gaga & Design" }
            - { name: koozo, label: "KOOZO" }
            - { name: horm, label: "HORM" }
            - { name: yamakawa, label: "Yamakawa" }
            - { name: mocoba, label: "Mocoba" }
            - { name: magenta, label: "Magenta" }
            - { name: norr11, label: "NORR11" }
            - { name: cuero, label: "Cuero" }
            - { name: thonet, label: "Thonet" }
            - { name: freifrau, label: "Freifrau" }
            - { name: janua, label: "Janua" }
            - { name: loomaligt, label: "Loomaligt" }
            - { name: piure, label: "Piure" }
            - { name: primitive, label: "Primitive" }
      - name: designer
        label: Designer (leave empty to show the brand name)
        type: string
      - name: year
        label: Design year
        type: string
      - name: category
        label: Category
        type: select
        required: true
        options:
          values: [Sofas, Armchairs, Chairs, Bar stools, Tables, Storage & shelving, Beds, Accessories]
      - name: price
        label: Price
        type: object
        fields:
          - name: type
            label: Price type
            type: select
            options:
              values:
                - { name: request, label: "On request (no price shown)" }
                - { name: fixed, label: "Fixed price" }
                - { name: from, label: "Starting from" }
          - name: amount
            label: Amount in ₪ (numbers only)
            type: number
          - name: max
            label: Up to ₪ (optional, for a price range)
            type: number
      - name: availability
        label: Availability (e.g. In stock, Made to order · 4–8 weeks)
        type: string
      - name: desc
        label: Description
        type: text
      - name: dims
        label: Dimensions (e.g. W 42 · D 50 · H 80 cm · Seat H 46)
        type: string
      - name: materials
        label: Materials
        type: string
      - name: colors
        label: Colours / finishes
        type: string
      - name: use
        label: Suitability (e.g. Indoor, Indoor / Outdoor)
        type: string
      - name: stackable
        label: Stackable
        type: boolean
      - name: images
        label: Product photos (white background, first photo is the cover)
        type: image
        required: true
        options:
          multiple: true
      - name: gallery
        label: Extra gallery photos (optional)
        type: image
        options:
          multiple: true
      - name: mood
        label: Mood / room photo (optional)
        type: image
      - name: pdf
        label: Catalogue link (web address, or an uploaded PDF like /assets/file.pdf)
        type: string
      - name: video
        label: Video link (optional)
        type: string
      # ---- Layout (designer only) ----
      - { name: ar, label: "Layout (designer only): photo ratio", type: string, readonly: true }
      - { name: variants, label: "Layout (designer only): has variants", type: boolean, readonly: true }
      - { name: fit, label: "Layout (designer only): image fit", type: string, readonly: true }
      - { name: shape, label: "Layout (designer only): shape", type: string, readonly: true }
      - { name: moodPos, label: "Layout (designer only): mood position", type: string, readonly: true }
      - { name: moodAr, label: "Layout (designer only): mood ratio", type: string, readonly: true }
      - { name: moodOld, label: "Layout (designer only): previous mood", type: string, readonly: true }
      - { name: ixPicks, label: "Layout (designer only): index picks", type: image, readonly: true, options: { multiple: true } }
      - { name: ixPhoto, label: "Layout (designer only): index photo", type: boolean, readonly: true }
      - { name: ottoman, label: "Layout (designer only): ottoman", type: boolean, readonly: true }
      - { name: lift, label: "Layout (designer only): lift", type: boolean, readonly: true }
      - { name: order, label: "Layout (designer only): position in the list (new pieces go last)", type: number, readonly: true }

  - name: brands
    label: Brands
    type: collection
    path: src/content/brands
    format: json
    filename: "{id}.json"
    operations:
      create: false
      rename: false
      delete: false
    view:
      primary: name
      fields: [name, country]
      sort: [order, name]
      default:
        sort: order
        order: asc
    fields:
      - name: id
        label: Brand ID
        type: string
        required: true
        readonly: true
      - name: name
        label: Name
        type: string
        required: true
      - name: country
        label: Country
        type: string
      - name: tagline
        label: Tagline (short line)
        type: string
      - name: blurb
        label: Blurb (shown on the home grid)
        type: text
      - name: short
        label: Short description
        type: text
      - name: long
        label: Full description (brand page)
        type: text
      - name: image
        label: Main image
        type: image
      - name: secondaryImage
        label: Second image (optional)
        type: image
      - { name: secondaryAr, label: "Layout (designer only): second image ratio", type: string, readonly: true }
      - { name: fit, label: "Layout (designer only): image fit", type: string, readonly: true }
      - { name: order, label: "Layout (designer only): position", type: number, readonly: true }
